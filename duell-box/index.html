<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duell-Box">
  <meta name="format-detection" content="telephone=no">
  <title>Duell-Box</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS 1.5.5; SRI = Hash der Datei dist/peerjs.min.js aus dem npm-Paket peerjs@1.5.5 -->
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"
          integrity="sha384-x0YgkOr/3UOZP2CRDxGW9e0Q+2Qjyr3uJrm4xU32Y7ZCNAo7Cc7bjhrZMi/dwczu"
          crossorigin="anonymous"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="brand">Duell<b>-Box</b></span>
      <button id="btn-mute" class="icon-btn" type="button" aria-label="Ton ausschalten" aria-pressed="false">🔊</button>
    </header>

    <!-- Startseite -->
    <section id="screen-home" class="screen" aria-labelledby="home-title">
      <div class="hero">
        <h1 id="home-title">Wer ist<br>der Champion?</h1>
        <p class="sub">4 Duelle. 2 Spieler. 1 Gewinner.</p>
      </div>

      <div class="card stack">
        <label class="field">
          <span class="label">Dein Name</span>
          <input id="inp-name" type="text" maxlength="16" autocomplete="nickname"
                 autocapitalize="words" spellcheck="false" placeholder="z. B. Kevin">
        </label>
        <button id="btn-create" class="btn btn-primary" type="button">Raum erstellen</button>

        <div class="divider"><span>oder</span></div>

        <label class="field">
          <span class="label">Raumcode</span>
          <input id="inp-code" type="text" inputmode="numeric" pattern="[0-9]*"
                 autocomplete="off" placeholder="4 Ziffern">
        </label>
        <button id="btn-join" class="btn btn-secondary" type="button">Raum beitreten</button>
        <p id="home-error" class="error" role="alert" hidden></p>
      </div>

      <button id="btn-local" class="btn btn-ghost" type="button">Lokal testen (1 Gerät)</button>
    </section>

    <!-- Warteraum (Host) -->
    <section id="screen-room" class="screen" aria-labelledby="room-title" hidden>
      <div class="hero">
        <h1 id="room-title">Dein Raum</h1>
        <p id="room-status" class="sub" aria-live="polite">Verbinde …</p>
      </div>
      <div class="card stack center">
        <span class="label">Raumcode</span>
        <output id="room-code" class="code" aria-live="polite">––––</output>
        <button id="btn-copy" class="btn btn-secondary" type="button" disabled>Code kopieren</button>
        <p class="hint">Dein Mitspieler gibt diesen Code unter „Raum beitreten“ ein.</p>
      </div>
      <button id="btn-room-cancel" class="btn btn-ghost" type="button">Abbrechen</button>
    </section>

    <!-- Bühne: je Spieler-Sitz eine Ansicht (online 1, lokal 2) -->
    <div id="stage" hidden>
      <div id="switcher" class="switcher" role="tablist" aria-label="Ansicht wechseln" hidden></div>
      <div id="seats"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <template id="tpl-seat">
    <section class="seat" hidden>
      <div class="view view-lobby">
        <div class="scoreboard" aria-label="Gesamtwertung"></div>
        <p class="lobby-hint"></p>
        <div class="games" role="list"></div>
        <button class="btn btn-secondary btn-mix" type="button" disabled>4er-Mix starten</button>
        <button class="btn btn-ghost btn-leave" type="button">Raum verlassen</button>
      </div>
      <div class="view view-mix" hidden>
        <div class="mix-body" aria-live="polite"></div>
      </div>
      <div class="view view-game" hidden>
        <div class="away-banner" role="alert" hidden></div>
        <div class="game-host"></div>
      </div>
    </section>
  </template>
</body>
</html>
